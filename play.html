<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171d34">
  <title>DDUNG 퍼즐</title>
  <link rel="stylesheet" href="./styles.css?v=35">
  <link rel="stylesheet" href="./play.css?v=12">
  <script type="module" src="./play.js?v=87"></script>
</head>
<body data-puzzle-player>
  <main class="puzzle-shell">
    <header class="puzzle-heading">
      <div class="puzzle-level">
        <p>DDUNG 퍼즐</p>
        <h1 id="levelTitle">레벨 1</h1>
        <div id="levelSelectControl">
          <label for="levelSelect">레벨 선택</label>
          <select id="levelSelect" class="field" disabled></select>
        </div>
      </div>
      <div class="puzzle-hud">
        <div class="puzzle-hud-card puzzle-moves">남은 이동<strong id="movesLeft">—</strong></div>
        <div class="puzzle-hud-card puzzle-moves" id="scoreCard" hidden>점수<strong><span id="score">0</span><span id="scoreTarget"></span></strong></div>
        <section class="puzzle-hud-card" id="goalCard" aria-labelledby="goalTitle">
          <div id="goalTitle">목표</div>
          <ul id="goals" class="puzzle-goals"></ul>
        </section>
      </div>
    </header>
    <section id="previewAutoControls" class="preview-auto-controls" aria-label="미리보기 자동 플레이" hidden>
      <form id="previewAutoForm">
        <label>자동 플레이 횟수 <input class="field" id="previewAutoRuns" type="number" min="1" max="1000" step="1" value="30" required></label>
        <button class="button primary" id="previewAutoStart" type="submit" disabled>자동 플레이</button>
        <button class="button" id="previewAutoCancel" type="button" hidden>계산 중단</button>
      </form>
      <div id="previewAutoSummary" class="preview-auto-summary" role="status" hidden></div>
      <div class="preview-auto-actions">
        <button class="button" id="previewAutoPause" type="button" hidden>대표 판 일시정지</button>
        <button class="button" id="previewAutoReplay" type="button" hidden>대표 판 다시 보기</button>
        <label>재생 속도 <select id="previewAutoSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
        <button class="button" id="previewAutoManual" type="button">직접 플레이로 초기화</button>
      </div>
    </section>
    <section class="puzzle-stage" id="simulationDialog" aria-labelledby="levelTitle">
      <div id="simulationGrid" class="simulation-grid" aria-label="퍼즐판"></div>
      <section id="boosterControls" class="booster-controls" aria-label="플레이 아이템" hidden></section>
      <p id="playtestFrameStatus" role="status">퍼즐을 불러오는 중입니다.</p>
      <input type="hidden" id="playtestSpeed" value="1">
      <div class="puzzle-actions">
        <button class="button" id="restart" hidden>다시 시작</button>
        <button class="button" id="hint" hidden>힌트</button>
        <button class="button" id="soundToggle" aria-pressed="true">사운드 켜짐</button>
        <button class="button" id="quit" hidden>퍼즐 종료</button>
        <button class="button" id="next" hidden>다음 레벨</button>
      </div>
    </section>
    <p class="puzzle-help">붙어 있는 블록을 드래그하거나 두 칸을 차례로 누르세요. 특수 피스는 누르면 발동합니다.</p>
  </main>
  <dialog id="clearDialog" class="puzzle-clear" aria-labelledby="clearTitle">
    <h2 id="clearTitle">클리어!</h2>
    <p id="clearMessage"></p>
    <p id="clearStars" class="puzzle-stars"></p>
    <p id="clearError" role="alert"></p>
    <div class="puzzle-actions">
      <button type="button" class="button" id="clearRestart">다시 시작</button>
      <button type="button" class="button puzzle-next" id="clearNext">다음 레벨</button>
    </div>
  </dialog>
</body>
</html>
